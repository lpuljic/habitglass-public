name: Sync Converted Content to Public Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert screenshots (if source exports exist)
        run: |
          if [ -d "assets/screens" ]; then
            echo "Found assets/screens/ — running optimise-shots.sh"
            chmod +x tools/optimise-shots.sh
            ./tools/optimise-shots.sh || echo "optimise-shots completed with missing sources"
          else
            echo "No assets/screens/ — skipping screenshot conversion"
          fi

      - name: Build OG image
        run: |
          chmod +x tools/make-og.sh || true
          ./tools/make-og.sh || echo "OG build skipped (requires Chrome)"

      - name: Push converted site to target public repo
        env:
          TOKEN: ${{ secrets.HABITGLASS_PUBLIC }}
          TARGET: lpuljic/habitglass-public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add or update remote
          git remote add target "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" 2>/dev/null || \
            git remote set-url target "https://x-access-token:${TOKEN}@github.com/${TARGET}.git"
          git branch -M main
          git push target main --force
